name: Windows foundation validation

on:
  pull_request:
    paths: ['windows/**', 'PickleballScreensaver/Resources/**', 'assets/icon/icon.svg', '.github/workflows/windows-foundation.yml']
  push:
    branches: [main]
    paths: ['windows/**', 'PickleballScreensaver/Resources/**', 'assets/icon/icon.svg', '.github/workflows/windows-foundation.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: macos-15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Pickleball.Core.Tests -c Release --nologo
      - run: python3 -B -m unittest discover -s packaging -p 'test_*.py'

  native-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
            architecture: X64
          - runner: windows-11-arm
            rid: win-arm64
            architecture: Arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Require native SDK and OS architecture
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne '${{ matrix.architecture }}') { throw 'Wrong OS architecture' }
          $info = dotnet --info
          $info
          if (-not ($info -match 'Architecture:\s+${{ matrix.architecture }}')) { throw 'SDK architecture not native' }
      - run: dotnet test tests/Pickleball.Core.Tests -c Release --nologo
      - run: python -B -m unittest discover -s packaging -p 'test_*.py'
      - name: Publish, audit native dependencies and make architecture-labeled ZIPs
        run: python packaging/publish.py --rid '${{ matrix.rid }}'
      - name: Native WPF child lifecycle and renamed self-contained apphost smoke tests
        run: |
          $scr = (Get-ChildItem artifacts -Recurse -Filter PickleballScreensaver.scr | Where-Object { $_.Directory.Name -notlike '*-folder' }).FullName
          if (@($scr).Count -ne 1) { throw 'Expected exactly one bundled .scr' }
          dotnet run --project tests/Pickleball.Windows.Tests -c Release -- artifacts/native-tests '${{ matrix.architecture }}' "$scr"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deterministic offscreen export
        run: |
          $arguments = @('--project', 'tools/Pickleball.Preview', '-c', 'Release', '--')
          dotnet run @arguments artifacts/native-tests/replay-a.png 120 42 1280x720 '2026-01-01T12:00:00.0000000+00:00'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run @arguments artifacts/native-tests/replay-b.png 120 42 1280x720 '2026-01-01T12:00:00.0000000+00:00'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash artifacts/native-tests/replay-a.png).Hash -ne (Get-FileHash artifacts/native-tests/replay-b.png).Hash) { throw 'Replay PNGs differ' }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-foundation-${{ matrix.rid }}
          path: |
            windows/artifacts/*.zip
            windows/artifacts/*.sha256
            windows/artifacts/native-tests/*.png
          if-no-files-found: error
