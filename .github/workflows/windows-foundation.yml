name: Windows validation

on:
  pull_request:
    paths: ['windows/**', 'PickleballScreensaver/**', 'assets/icon/icon.svg', '.github/workflows/windows-foundation.yml', '.github/workflows/windows-build.yml', '.github/workflows/release.yml']
  push:
    branches: [main]
    paths: ['windows/**', 'PickleballScreensaver/**', 'assets/icon/icon.svg', '.github/workflows/windows-foundation.yml', '.github/workflows/windows-build.yml', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign Windows candidates on main only (requires separate Windows secrets; NEVER publishes a release)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      artifact-prefix: Windows-candidate
      sign: ${{ github.event_name == 'workflow_dispatch' && inputs.sign }}
    secrets:
      WINDOWS_SIGNING_PFX_BASE64: ${{ github.event_name == 'workflow_dispatch' && inputs.sign && github.ref == 'refs/heads/main' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
      WINDOWS_SIGNING_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.sign && github.ref == 'refs/heads/main' && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
