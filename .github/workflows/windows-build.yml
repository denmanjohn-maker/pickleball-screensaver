name: Windows build

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: 'Distinct names for validation and release-build artifacts'
        type: string
        default: Windows-candidate
      sign:
        description: 'Sign validation candidates on main only'
        type: boolean
        default: false
    secrets:
      WINDOWS_SIGNING_PFX_BASE64:
        required: false
      WINDOWS_SIGNING_PASSWORD:
        required: false

permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  portable-core:
    runs-on: macos-15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Windows and macOS product versions agree
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 packaging/release.py version --tag "$RELEASE_TAG"
          if [[ '${{ inputs.sign }}' == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Signing candidates is restricted to main after review"
            exit 1
          fi
      - run: dotnet test tests/Pickleball.Core.Tests -c Release --nologo
      - run: python3 -B -m unittest discover -s packaging -p 'test_*.py'
      - name: Regenerate unchanged Swift golden contact traces
        run: |
          mkdir -p artifacts/swift-reference
          swiftc ../PickleballScreensaver/RallyEngine.swift tools/parity/main.swift -o artifacts/swift-reference/export
          artifacts/swift-reference/export artifacts/swift-reference/final-main-seed42.json
          python3 tools/parity/compare.py tests/Pickleball.Core.Tests/Fixtures/final-main-seed42.json artifacts/swift-reference/final-main-seed42.json

  themes:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build two architecture-independent clean wallpaper CAB theme packs
        run: |
          ./packaging/build-themes.ps1 -Output "$PWD/artifacts/themes"
          python packaging/audit_themes.py artifacts/themes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-themes
          path: |
            windows/artifacts/themes/*.deskthemepack
            windows/artifacts/themes/*.sha256
          if-no-files-found: error

  native-windows:
    needs: [portable-core, themes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
            architecture: X64
          - runner: windows-11-arm
            rid: win-arm64
            architecture: Arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Require native SDK and OS architecture
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne '${{ matrix.architecture }}') { throw 'Wrong OS architecture' }
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne '${{ matrix.architecture }}') { throw 'PowerShell process is emulated' }
          $info = dotnet --info
          $info
          if (-not ($info -match 'Architecture:\s+${{ matrix.architecture }}')) { throw 'SDK architecture not native' }
      - name: Resolve product and synthetic upgrade versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python packaging/release.py version --tag "$env:RELEASE_TAG" --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet test tests/Pickleball.Core.Tests -c Release --nologo
      - run: python -B -m unittest discover -s packaging -p 'test_*.py'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-themes
          path: windows/artifacts/themes
      - name: Publish, audit native dependencies and make architecture-labeled ZIPs
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ inputs.sign && github.ref == 'refs/heads/main' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          WINDOWS_SIGNING_PASSWORD: ${{ inputs.sign && github.ref == 'refs/heads/main' && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $sign = @()
          if ('${{ inputs.sign }}' -eq 'true') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Signing candidates is restricted to main after review' }
            $sign = @('--sign')
          }
          python packaging/publish.py --rid '${{ matrix.rid }}' @sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native WPF child lifecycle and renamed self-contained apphost smoke tests
        run: |
          $scr = (Get-ChildItem artifacts -Recurse -Filter PickleballScreensaver.scr | Where-Object { $_.Directory.Name -notlike '*-folder' }).FullName
          if (@($scr).Count -ne 1) { throw 'Expected exactly one bundled .scr' }
          dotnet run --project tests/Pickleball.Windows.Tests -c Release -- artifacts/native-tests '${{ matrix.architecture }}' "$scr"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: All five appearances, formats, motion and viewport image fixtures
        run: ./packaging/test-render.ps1 -Output "$PWD/artifacts/native-tests"
      - name: Build native current-user MSI without third-party installer tooling
        env:
          PRODUCT_VERSION: ${{ steps.version.outputs.version }}
          UPGRADE_VERSION: ${{ steps.version.outputs.upgrade_version }}
        run: |
          $payload = Join-Path "$PWD/artifacts" "PickleballScreensaver-$env:PRODUCT_VERSION-${{ matrix.rid }}"
          ./packaging/build-msi.ps1 -Rid '${{ matrix.rid }}' -Payload "$payload" -Themes "$PWD/artifacts/themes" -Output "$PWD/artifacts/installers" -Version "$env:PRODUCT_VERSION"
          # Synthetic next-version fixture is test-only and is never uploaded as a product candidate.
          ./packaging/build-msi.ps1 -Rid '${{ matrix.rid }}' -Payload "$payload" -Themes "$PWD/artifacts/themes" -Output "$PWD/artifacts/native-tests/upgrade" -Version "$env:UPGRADE_VERSION"
      - name: Installer registration, repair and owned-file/reference removal
        run: |
          $msi = (Get-ChildItem artifacts/installers -Filter *.msi).FullName
          $upgrade = (Get-ChildItem artifacts/native-tests/upgrade -Filter *.msi).FullName
          ./packaging/test-native-packages.ps1 -Msi "$msi" -UpgradeMsi "$upgrade" -Output "$PWD/artifacts/native-tests/msi" -IsolatedRunner
      - name: Optionally sign MSI candidate and write final checksums
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ inputs.sign && github.ref == 'refs/heads/main' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          WINDOWS_SIGNING_PASSWORD: ${{ inputs.sign && github.ref == 'refs/heads/main' && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          foreach ($file in Get-ChildItem artifacts/installers -Filter *.msi) {
            if ('${{ inputs.sign }}' -eq 'true') { ./packaging/sign.ps1 -Path $file.FullName }
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Set-Content "$($file.FullName).sha256" -Encoding ASCII
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.rid }}
          path: |
            windows/artifacts/*.zip
            windows/artifacts/*.sha256
            windows/artifacts/installers/*.msi
            windows/artifacts/installers/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.rid }}-diagnostics
          path: |
            windows/artifacts/native-tests/*.png
            windows/artifacts/native-tests/msi/*.log
          if-no-files-found: warn
