name: Regression checks

on:
  pull_request:
    paths:
      - 'PickleballScreensaver/**'
      - 'docs/**'
      - 'scripts/preview/**'
      - 'scripts/tests/**'
      - 'Makefile'
      - '.github/workflows/regressions.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/windows-foundation.yml'
      - 'windows/packaging/**'
      - 'windows/Directory.Build.props'
  push:
    branches: [main]
    paths:
      - 'PickleballScreensaver/**'
      - 'docs/**'
      - 'scripts/preview/**'
      - 'scripts/tests/**'
      - 'Makefile'
      - '.github/workflows/regressions.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/windows-foundation.yml'
      - 'windows/packaging/**'
      - 'windows/Directory.Build.props'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regressions:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check simulation and camera regressions
        run: make test
      - name: Build universal screensaver
        run: make
