# Builds macOS and native Windows packages together when a v* tag is pushed.
# macOS is signed/notarized; Windows is explicitly unsigned.
# Manual runs upload artifacts only, even when a tag is selected.
#
# Required repository secrets (Settings → Secrets and variables → Actions);
# see DISTRIBUTING.md § "Cutting a release" for how to create each one:
#   APPLE_CERT_APPLICATION_P12  base64 of the Developer ID Application .p12
#   APPLE_CERT_INSTALLER_P12    base64 of the Developer ID Installer .p12
#   APPLE_CERT_PASSWORD         password the .p12 files were exported with
#   APPLE_SIGN_ID               "Developer ID Application: Name (TEAMID)"
#   APPLE_INSTALLER_SIGN_ID     "Developer ID Installer: Name (TEAMID)"
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_TEAM_ID               10-character team ID
#   APPLE_APP_PASSWORD          app-specific password from account.apple.com
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build-only dry run (never publishes a release)'
        type: choice
        options: [all, windows, macos]
        default: all

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    if: github.event_name == 'push' || inputs.platform != 'windows'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches Info.plist version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" PickleballScreensaver/Info.plist)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PLIST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $PLIST_VERSION. Bump CFBundleShortVersionString before tagging."
            exit 1
          fi

      - name: Validate notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::error::Set APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_PASSWORD in repository Actions secrets."
            exit 1
          fi
          if ! xcrun notarytool history \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --output-format json > /dev/null; then
            echo "::error::Apple notarization authentication failed. Verify APPLE_ID and APPLE_TEAM_ID, and replace APPLE_APP_PASSWORD with a valid app-specific password for that Apple ID at https://account.apple.com."
            exit 1
          fi

      - name: Import signing certificates
        env:
          APPLE_CERT_APPLICATION_P12: ${{ secrets.APPLE_CERT_APPLICATION_P12 }}
          APPLE_CERT_INSTALLER_P12: ${{ secrets.APPLE_CERT_INSTALLER_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERT_APPLICATION_P12" | base64 --decode > "$RUNNER_TEMP/application.p12"
          echo "$APPLE_CERT_INSTALLER_P12"   | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/application.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -A
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/productsign -T /usr/bin/pkgbuild -A
          rm -f "$RUNNER_TEMP/application.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build signed zip and dmg
        env:
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
          APPLE_INSTALLER_SIGN_ID: ${{ secrets.APPLE_INSTALLER_SIGN_ID }}
        run: |
          # macOS runners don't ship GNU timeout; use perl's alarm instead.
          perl -e 'alarm shift; exec @ARGV' 300 make dist SIGN_ID="$APPLE_SIGN_ID"
          perl -e 'alarm shift; exec @ARGV' 300 make dmg SIGN_ID="$APPLE_SIGN_ID" INSTALLER_SIGN_ID="$APPLE_INSTALLER_SIGN_ID"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" PickleballScreensaver/Info.plist)

          # Apple's notary service has taken 20-30+ min to process
          # submissions from this (freshly re-issued) cert - confirmed via
          # `notarytool history` that earlier "stuck" submissions did
          # eventually reach Accepted. `submit --wait` has no way to bound
          # a single invocation, so submit separately and poll via `wait`
          # ourselves in bounded chunks; this keeps the job from running
          # indefinitely while still tolerating genuinely slow processing.
          notarize() {
            local file="$1"
            local id submission
            if ! submission=$(xcrun notarytool submit "$file" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --output-format json); then
              echo "::error::Notarization submission failed for $file. See the notarytool error above."
              return 1
            fi
            id=$(printf '%s' "$submission" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            echo "Submitted $file as $id"
            local attempt
            for attempt in $(seq 1 20); do
              if perl -e 'alarm shift; exec @ARGV' 150 \
                xcrun notarytool wait "$id" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD"; then
                return 0
              fi
              echo "notarytool wait stalled or failed on attempt $attempt, retrying..."
            done
            echo "::error::Gave up waiting for notarization of $file after repeated stalls"
            return 1
          }

          # Notarize the zipped .saver, then staple the bundle and re-zip so
          # the ticket ships inside the archive and verifies offline.
          notarize "PickleballScreensaver-$VERSION.zip"
          xcrun stapler staple PickleballScreensaver.saver
          rm "PickleballScreensaver-$VERSION.zip"
          ditto -c -k --keepParent PickleballScreensaver.saver "PickleballScreensaver-$VERSION.zip"

          # Notarize the dmg (covers the nested pkg and saver) and staple it.
          notarize "PickleballScreensaver-$VERSION.dmg"
          xcrun stapler staple "PickleballScreensaver-$VERSION.dmg"

          xcrun stapler validate PickleballScreensaver.saver
          xcrun stapler validate "PickleballScreensaver-$VERSION.dmg"
          spctl -a -vv -t install PickleballScreensaver.saver

      # The download page links releases/latest/download/PickleballScreensaver.dmg,
      # so every release must also carry version-less asset names.
      - name: Make versionless asset copies
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" PickleballScreensaver/Info.plist)
          cp "PickleballScreensaver-$VERSION.zip" PickleballScreensaver.zip
          cp "PickleballScreensaver-$VERSION.dmg" PickleballScreensaver.dmg

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: PickleballScreensaver-macos
          path: |
            PickleballScreensaver-*.zip
            PickleballScreensaver-*.dmg
            PickleballScreensaver.zip
            PickleballScreensaver.dmg
          if-no-files-found: error

  windows:
    if: github.event_name == 'push' || inputs.platform != 'macos'
    uses: ./.github/workflows/windows-build.yml
    with:
      artifact-prefix: Windows-release
      sign: false

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          python3 windows/packaging/release.py check-new --tag "$RELEASE_TAG" --releases "$RUNNER_TEMP/releases.json"
      - uses: actions/download-artifact@v4
        with:
          name: PickleballScreensaver-macos
          path: windows/artifacts/downloads/macos
      - uses: actions/download-artifact@v4
        with:
          name: Windows-release-themes
          path: windows/artifacts/downloads/themes
      - uses: actions/download-artifact@v4
        with:
          name: Windows-release-win-x64
          path: windows/artifacts/downloads/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: Windows-release-win-arm64
          path: windows/artifacts/downloads/win-arm64
      - name: Validate release inventory and make Windows download aliases
        id: assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 windows/packaging/release.py stage --tag "$RELEASE_TAG" \
            --input windows/artifacts/downloads --output windows/artifacts/release \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload complete release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_FILES: ${{ steps.assets.outputs.files }}
          RELEASE_NOTES: |
            ### macOS 14+
            Download `PickleballScreensaver.dmg`, open it, and double-click the
            installer package inside. Then pick the screensaver in
            **System Settings → Screen Saver**. macOS builds are signed and notarized.

            ### Windows 11 — unsigned
            Choose **win-x64** for Intel/AMD PCs or **win-arm64** for ARM PCs
            (Settings → System → About → System type). Download the matching
            `PickleballScreensaver-win-x64.msi` or `PickleballScreensaver-win-arm64.msi`
            for a current-user install, or the matching portable ZIP.
            .NET is included; keep all portable files together.
            Use **Pickleball Select (opt in)** in the Start menu to select the saver,
            and **Pickleball settings** to configure it. Installation does not
            automatically activate a saver, apply a theme or change security policy.
            Classic and Black Light `.deskthemepack` downloads are optional wallpapers.

            **Windows packages are unsigned.** Windows may display unknown-publisher
            or SmartScreen warnings. Signing/reputation and final Windows 11 desktop,
            standard-user and performance acceptance are not certified by these builds.
            Each Windows package has a matching SHA-256 file.

            Downloads and instructions: [download page](https://denmanjohn-maker.github.io/pickleball-screensaver/).
            Acceptance details: [Windows guide](https://github.com/denmanjohn-maker/pickleball-screensaver/blob/main/windows/README.md#evidence-and-outstanding-acceptance).
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          assets=()
          while IFS= read -r file; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing release asset: $file"
              exit 1
            fi
            assets+=("$file")
          done <<< "$ASSET_FILES"
          gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag \
            --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Publish the fully uploaded release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
