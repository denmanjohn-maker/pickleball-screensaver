# Builds, signs, notarizes, and publishes the screensaver when a v* tag is
# pushed. Run manually (workflow_dispatch) for a build-only dry run that
# uploads the artifacts without creating a release.
#
# Required repository secrets (Settings → Secrets and variables → Actions);
# see DISTRIBUTING.md § "Cutting a release" for how to create each one:
#   APPLE_CERT_APPLICATION_P12  base64 of the Developer ID Application .p12
#   APPLE_CERT_INSTALLER_P12    base64 of the Developer ID Installer .p12
#   APPLE_CERT_PASSWORD         password the .p12 files were exported with
#   APPLE_SIGN_ID               "Developer ID Application: Name (TEAMID)"
#   APPLE_INSTALLER_SIGN_ID     "Developer ID Installer: Name (TEAMID)"
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_TEAM_ID               10-character team ID
#   APPLE_APP_PASSWORD          app-specific password from account.apple.com
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches Info.plist version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" PickleballScreensaver/Info.plist)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PLIST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $PLIST_VERSION. Bump CFBundleShortVersionString before tagging."
            exit 1
          fi

      - name: Import signing certificates
        env:
          APPLE_CERT_APPLICATION_P12: ${{ secrets.APPLE_CERT_APPLICATION_P12 }}
          APPLE_CERT_INSTALLER_P12: ${{ secrets.APPLE_CERT_INSTALLER_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERT_APPLICATION_P12" | base64 --decode > "$RUNNER_TEMP/application.p12"
          echo "$APPLE_CERT_INSTALLER_P12"   | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/application.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/productsign -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/application.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build signed zip and dmg
        env:
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
          APPLE_INSTALLER_SIGN_ID: ${{ secrets.APPLE_INSTALLER_SIGN_ID }}
        run: |
          make dist SIGN_ID="$APPLE_SIGN_ID"
          make dmg SIGN_ID="$APPLE_SIGN_ID" INSTALLER_SIGN_ID="$APPLE_INSTALLER_SIGN_ID"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" PickleballScreensaver/Info.plist)

          # Notarize the zipped .saver, then staple the bundle and re-zip so
          # the ticket ships inside the archive and verifies offline.
          xcrun notarytool submit "PickleballScreensaver-$VERSION.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple PickleballScreensaver.saver
          rm "PickleballScreensaver-$VERSION.zip"
          ditto -c -k --keepParent PickleballScreensaver.saver "PickleballScreensaver-$VERSION.zip"

          # Notarize the dmg (covers the nested pkg and saver) and staple it.
          xcrun notarytool submit "PickleballScreensaver-$VERSION.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "PickleballScreensaver-$VERSION.dmg"

          xcrun stapler validate PickleballScreensaver.saver
          xcrun stapler validate "PickleballScreensaver-$VERSION.dmg"
          spctl -a -vv -t install PickleballScreensaver.saver

      # The download page links releases/latest/download/PickleballScreensaver.dmg,
      # so every release must also carry version-less asset names.
      - name: Make versionless asset copies
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" PickleballScreensaver/Info.plist)
          cp "PickleballScreensaver-$VERSION.zip" PickleballScreensaver.zip
          cp "PickleballScreensaver-$VERSION.dmg" PickleballScreensaver.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PickleballScreensaver-*.zip
            PickleballScreensaver-*.dmg
            PickleballScreensaver.zip
            PickleballScreensaver.dmg
          generate_release_notes: true
          body: |
            ### Install
            Download `PickleballScreensaver.dmg`, open it, and double-click the
            installer package inside. Then pick the screensaver in
            **System Settings → Screen Saver**. Builds are signed and notarized,
            so macOS opens them without warnings.

            More details on the [download page](https://denmanjohn-maker.github.io/pickleball-screensaver/).

      - name: Upload build artifacts (dry run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PickleballScreensaver
          path: |
            PickleballScreensaver-*.zip
            PickleballScreensaver-*.dmg
